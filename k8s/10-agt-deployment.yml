apiVersion: apps/v1
kind: Deployment
metadata:
  name: dcre-agt
  namespace: dcre
  labels:
    app.kubernetes.io/name: dcre-agt
    app.kubernetes.io/part-of: dcre
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: dcre-agt
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dcre-agt
        app: dcre-agt
    spec:
      serviceAccountName: dcre-agt
      containers:
        - name: agt
          image: dcre-agt:m5
          imagePullPolicy: IfNotPresent
          env:
            - name: AGT_DB_URL
              value: jdbc:postgresql://crdb:26257/agt_ops?sslmode=disable
            - name: DCRE_EXCHANGE_ROOT
              value: /exchange
            - name: AGT_NAMESPACE
              value: dcre
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://host.docker.internal:4317
            - name: AGT_CRR_IMAGE
              value: dcre-crr:m4
            - name: AGT_CTV_IMAGE
              value: dcre-ctv:m5
            - name: AGT_CIR_IMAGE
              value: dcre-cir:m4
            - name: AGT_CDE_IMAGE
              value: dcre-cde:m4
            - name: AGT_CRW_IMAGE
              value: dcre-crw:m4
            - name: AGT_IXR_IMAGE
              value: dcre-ixr:m4
            - name: AGT_SXR_IMAGE
              value: dcre-sxr:m4
            - name: AGT_PXR_IMAGE
              value: dcre-pxr:m4
            - name: AGT_PRG_IMAGE
              value: dcre-prg:m4
            - name: AGT_AIS_IMAGE
              value: dcre-ais:m5
            - name: AGT_HCS_IMAGE
              value: dcre-hcs:m6
          volumeMounts:
            - name: exchange
              mountPath: /exchange
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              memory: 768Mi
      volumes:
        - name: exchange
          persistentVolumeClaim:
            claimName: dcre-exchange
