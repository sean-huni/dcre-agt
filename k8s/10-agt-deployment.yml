apiVersion: apps/v1
kind: Deployment
metadata:
  name: dcre-agt
  namespace: dcre
  labels:
    app.kubernetes.io/name: dcre-agt
    app.kubernetes.io/part-of: dcre
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: dcre-agt
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dcre-agt
        app: dcre-agt
    spec:
      serviceAccountName: dcre-agt
      containers:
        - name: agt
          image: dcre-agt:m7
          imagePullPolicy: IfNotPresent
          env:
            - name: AGT_DB_URL
              value: jdbc:postgresql://crdb:26257/agt_ops?sslmode=disable
            # SCRUM-107: the SECOND, read-only datasource into dcre_col (SCRUM-55,
            # prg_report_due / prg_sla_pending). It was never added here, so every
            # in-cluster AGT fell back to the committed localhost dev default and
            # /q/health/ready stayed DOWN forever with "Connection to
            # localhost:26257 refused" - the pod runs, the readiness probe never
            # passes, and the rollout times out. Same shape as the CTV
            # mandates-db-url incident (JobLauncher.CTV_MANDATES_DB_URL_ENV).
            - name: AGT_COLLECTIONS_DB_URL
              value: jdbc:postgresql://crdb:26257/dcre_col?sslmode=disable
            # v1 topology: the PAYMENTS read seam. dcre_pay publishes views with the
            # SAME NAMES (prg_report_due, prg_sla_pending), owned by PRG. Absent, the
            # payments datasource falls back to the committed localhost dev default,
            # exactly as AGT_COLLECTIONS_DB_URL did before SCRUM-107 added it.
            - name: AGT_PAYMENTS_DB_URL
              value: jdbc:postgresql://crdb:26257/dcre_pay?sslmode=disable
            # The JDBC url handed to every PAYMENTS stage pod as DCRE_DB_URL. Without
            # it those pods write dcre_col and nothing errors.
            - name: AGT_PAY_SERVICE_DB_URL
              value: jdbc:postgresql://crdb.dcre.svc.cluster.local:26257/dcre_pay?sslmode=disable
            # Owner ruling 2026-08-08: the two cross-family reference contexts own
            # their own databases. HCS used to receive AGT_SERVICE_DB_URL (dcre_col);
            # shared/hcs now refuses to start unless current_database() is dcre_hcs,
            # so with the old routing every HCS pod dies on startup rather than
            # quietly rebuilding the calendar in the collections database.
            - name: AGT_HCS_SERVICE_DB_URL
              value: jdbc:postgresql://crdb.dcre.svc.cluster.local:26257/dcre_hcs?sslmode=disable
            # No Stage maps to ACS yet (shared/acs is being built); set here so the
            # database exists in the deployment's vocabulary the day the stage lands.
            - name: AGT_ACS_SERVICE_DB_URL
              value: jdbc:postgresql://crdb.dcre.svc.cluster.local:26257/dcre_acs?sslmode=disable
            - name: DCRE_EXCHANGE_ROOT
              value: /exchange
            - name: AGT_NAMESPACE
              value: dcre
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://lgtm:4317
            # The 29 stage images: the diagrams' roster (28 stage services plus the
            # cross-family HCS), matching infra/dcre-infra/scripts/switch-version.sh,
            # which sets these same variables on this deployment.
            #
            # PRG CHANGED MEANING at the 2026-08-08 cutover: it named the COLLECTIONS
            # report generator (dcre-prg:m7 above) and now names the PAYMENTS one.
            # The collections generator is CRG. Read every occurrence in context; a
            # find-and-replace produces a manifest that applies and is inverted.
            #
            # Tags are the 1.x line: the v1 cutover retired the pre-cutover image
            # names (dcre-ixr, dcre-sxr, dcre-pxr, dcre-ais, and the collections
            # dcre-prg), so an m7 tag here would wedge the stage on ImagePullBackOff.
            # collections
            - name: AGT_CRR_IMAGE
              value: dcre-crr:1.0.0
            - name: AGT_CTV_IMAGE
              value: dcre-ctv:1.0.0
            - name: AGT_CDE_IMAGE
              value: dcre-cde:1.0.0
            - name: AGT_CRW_IMAGE
              value: dcre-crw:1.0.0
            - name: AGT_CIR_IMAGE
              value: dcre-cir:1.0.0
            - name: AGT_CIX_IMAGE
              value: dcre-cix:1.0.0
            - name: AGT_CSX_IMAGE
              value: dcre-csx:1.0.0
            - name: AGT_CPX_IMAGE
              value: dcre-cpx:1.0.0
            - name: AGT_CRG_IMAGE
              value: dcre-crg:1.0.0
            # payments
            - name: AGT_PRR_IMAGE
              value: dcre-prr:1.0.0
            - name: AGT_PTV_IMAGE
              value: dcre-ptv:1.0.0
            - name: AGT_PAI_IMAGE
              value: dcre-pai:1.0.0
            - name: AGT_PRW_IMAGE
              value: dcre-prw:1.0.0
            - name: AGT_PIR_IMAGE
              value: dcre-pir:1.0.0
            - name: AGT_PIX_IMAGE
              value: dcre-pix:1.0.0
            - name: AGT_PSX_IMAGE
              value: dcre-psx:1.0.0
            - name: AGT_PPX_IMAGE
              value: dcre-ppx:1.0.0
            - name: AGT_PRG_IMAGE
              value: dcre-prg:1.0.0
            # mandates
            - name: AGT_MRR_IMAGE
              value: dcre-mrr:1.0.0
            - name: AGT_MRV_IMAGE
              value: dcre-mrv:1.0.0
            - name: AGT_MAS_IMAGE
              value: dcre-mas:1.0.0
            - name: AGT_MIT_IMAGE
              value: dcre-mit:1.0.0
            - name: AGT_MIR_IMAGE
              value: dcre-mir:1.0.0
            - name: AGT_MRW_IMAGE
              value: dcre-mrw:1.0.0
            - name: AGT_MIX_IMAGE
              value: dcre-mix:1.0.0
            - name: AGT_MSX_IMAGE
              value: dcre-msx:1.0.0
            - name: AGT_MPX_IMAGE
              value: dcre-mpx:1.0.0
            - name: AGT_MRG_IMAGE
              value: dcre-mrg:1.0.0
            # cross-family
            - name: AGT_HCS_IMAGE
              value: dcre-hcs:1.0.0
            # SCRUM-107: the second cross-family shared context. NOTE FOR INFRA:
            # switch-version.sh has STAGES_CROSS="HCS" and does not know about ACS,
            # so it will not export this variable. Set here, and the script needs the
            # same edit or the census stage stays launch-disabled (empty image =
            # SCRUM-33 launch-disabled, which is silent by design).
            - name: AGT_ACS_IMAGE
              value: dcre-acs:1.0.0
          volumeMounts:
            - name: exchange
              mountPath: /exchange
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          # M12/SCRUM-87 (R-47): startupProbe decouples cold-boot latency from the
          # liveness deadline. While it is still failing, k8s runs NEITHER the
          # liveness nor the readiness probe, so a slow Liquibase-on-CRDB migration
          # (budgeted up to 30 x 10s = 5 min here) cannot be liveness-killed into a
          # crashloop. Once it passes, the livenessProbe below takes over.
          startupProbe:
            httpGet:
              path: /q/health/live
              port: 8080
            periodSeconds: 10
            failureThreshold: 30
          # AGT self-liveness. ReconcilerLivenessCheck goes DOWN when the reconcile
          # scheduler has not ticked within AGT_SELF_LIVENESS_TTL_SECONDS (default
          # 15s); k8s restarts the wedged pod and the lease-CAS re-acquires the
          # single-writer role. Only a BOOTED-then-wedged AGT trips this (startup
          # gates it), so initialDelaySeconds is 0; 3 x 10s = wedged ~30s -> restart.
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: 8080
            initialDelaySeconds: 0
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              memory: 768Mi
      volumes:
        - name: exchange
          persistentVolumeClaim:
            claimName: dcre-exchange
