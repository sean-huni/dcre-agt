apiVersion: apps/v1
kind: Deployment
metadata:
  name: dcre-agt
  namespace: dcre
  labels:
    app.kubernetes.io/name: dcre-agt
    app.kubernetes.io/part-of: dcre
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: dcre-agt
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dcre-agt
        app: dcre-agt
    spec:
      serviceAccountName: dcre-agt
      containers:
        - name: agt
          image: dcre-agt:m7
          imagePullPolicy: IfNotPresent
          env:
            - name: AGT_DB_URL
              value: jdbc:postgresql://crdb:26257/agt_ops?sslmode=disable
            - name: DCRE_EXCHANGE_ROOT
              value: /exchange
            - name: AGT_NAMESPACE
              value: dcre
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://lgtm:4317
            - name: AGT_CRR_IMAGE
              value: dcre-crr:m7
            - name: AGT_CTV_IMAGE
              value: dcre-ctv:m7
            - name: AGT_CIR_IMAGE
              value: dcre-cir:m7
            - name: AGT_CDE_IMAGE
              value: dcre-cde:m7
            - name: AGT_CRW_IMAGE
              value: dcre-crw:m7
            - name: AGT_IXR_IMAGE
              value: dcre-ixr:m7
            - name: AGT_SXR_IMAGE
              value: dcre-sxr:m7
            - name: AGT_PXR_IMAGE
              value: dcre-pxr:m7
            - name: AGT_PRG_IMAGE
              value: dcre-prg:m7
            - name: AGT_AIS_IMAGE
              value: dcre-ais:m7
            - name: AGT_HCS_IMAGE
              value: dcre-hcs:m7
          volumeMounts:
            - name: exchange
              mountPath: /exchange
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          # M12/SCRUM-87 (R-47): AGT self-liveness. ReconcilerLivenessCheck goes
          # DOWN when the reconcile scheduler has not ticked within
          # AGT_SELF_LIVENESS_TTL_SECONDS (default 15s); k8s then restarts the
          # wedged pod and the lease-CAS re-acquires the single-writer role.
          # initialDelaySeconds covers AGT boot; 3 x 10s = wedged for ~30s -> restart.
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              memory: 768Mi
      volumes:
        - name: exchange
          persistentVolumeClaim:
            claimName: dcre-exchange
