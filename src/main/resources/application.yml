# 12FactorApp: committed working dev defaults; env overrides. (yml-only rule, configuration.md p19)
quarkus:
  datasource:
    db-kind: postgresql
    jdbc:
      url: ${AGT_DB_URL:jdbc:postgresql://localhost:26257/agt_ops?sslmode=disable}
    username: ${AGT_DB_USER:root}
    password: ${AGT_DB_PASSWORD:}
    # SCRUM-55: read-only window into the collections DB (prg_report_due,
    # prg_sla_pending, crw_emission_owed). CRG/CRW own the schema; AGT never writes here.
    "collections":
      db-kind: postgresql
      jdbc:
        url: ${AGT_COLLECTIONS_DB_URL:jdbc:postgresql://localhost:26257/dcre_col?sslmode=disable}
      username: ${AGT_COLLECTIONS_DB_USER:root}
      password: ${AGT_COLLECTIONS_DB_PASSWORD:}
    # v1 topology: the PAYMENTS twin. dcre_pay publishes views with the SAME NAMES
    # (prg_report_due, prg_sla_pending), owned by PRG. Without this datasource the
    # payments IMMEDIATE report path is not misrouted, it simply never fires, and
    # nothing errors. It is a missing READ SEAM, not a rename.
    "payments":
      db-kind: postgresql
      jdbc:
        url: ${AGT_PAYMENTS_DB_URL:jdbc:postgresql://localhost:26257/dcre_pay?sslmode=disable}
      username: ${AGT_PAYMENTS_DB_USER:root}
      password: ${AGT_PAYMENTS_DB_PASSWORD:}
  liquibase:
    migrate-at-start: true
    change-log: db/changelog/db.changelog-master.xml
  kubernetes-client:
    namespace: ${AGT_NAMESPACE:dcre}
    devservices:
      enabled: false
  otel:
    exporter:
      otlp:
        endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
  log:
    console:
      format: "%d{HH:mm:ss} %-5p [%c{2.}] %s%e%n"

agt:
  exchange-root: ${DCRE_EXCHANGE_ROOT:../../../../../infra/dcre-infra/exchange}
  # Per-client inbound exchange layout (SCRUM-42, R-30 amendment). AGT owns only
  # the three inbound channels; relative paths resolve against exchange-root.
  # Base config (dev/prod parity); %test inherits this and only overrides exchange-root.
  exchange:
    clients:
      FNBCC01:
        onhost-req:      { in: fnbcc01/onhost-req/in,      error: fnbcc01/onhost-req/error,      archive: fnbcc01/onhost-req/archive }
        onhost-req-endo: { in: fnbcc01/onhost-req-endo/in, error: fnbcc01/onhost-req-endo/error, archive: fnbcc01/onhost-req-endo/archive }
        fint-resp:       { in: fnbcc01/fint-resp/in,       error: fnbcc01/fint-resp/error,       archive: fnbcc01/fint-resp/archive }
        onhost-req-man:  { in: fnbcc01/onhost-req-man/in,  error: fnbcc01/onhost-req-man/error,  archive: fnbcc01/onhost-req-man/archive }
        fint-resp-man:   { in: fnbcc01/fint-resp-man/in,   error: fnbcc01/fint-resp-man/error,   archive: fnbcc01/fint-resp-man/archive }
      FNBCC02:
        onhost-req:      { in: fnbcc02/onhost-req/in,      error: fnbcc02/onhost-req/error,      archive: fnbcc02/onhost-req/archive }
        onhost-req-endo: { in: fnbcc02/onhost-req-endo/in, error: fnbcc02/onhost-req-endo/error, archive: fnbcc02/onhost-req-endo/archive }
        fint-resp:       { in: fnbcc02/fint-resp/in,       error: fnbcc02/fint-resp/error,       archive: fnbcc02/fint-resp/archive }
        onhost-req-man:  { in: fnbcc02/onhost-req-man/in,  error: fnbcc02/onhost-req-man/error,  archive: fnbcc02/onhost-req-man/archive }
        fint-resp-man:   { in: fnbcc02/fint-resp-man/in,   error: fnbcc02/fint-resp-man/error,   archive: fnbcc02/fint-resp-man/archive }
      FNBRF01:
        onhost-req:      { in: fnbrf01/onhost-req/in,      error: fnbrf01/onhost-req/error,      archive: fnbrf01/onhost-req/archive }
        onhost-req-endo: { in: fnbrf01/onhost-req-endo/in, error: fnbrf01/onhost-req-endo/error, archive: fnbrf01/onhost-req-endo/archive }
        fint-resp:       { in: fnbrf01/fint-resp/in,       error: fnbrf01/fint-resp/error,       archive: fnbrf01/fint-resp/archive }
        onhost-req-man:  { in: fnbrf01/onhost-req-man/in,  error: fnbrf01/onhost-req-man/error,  archive: fnbrf01/onhost-req-man/archive }
        fint-resp-man:   { in: fnbrf01/fint-resp-man/in,   error: fnbrf01/fint-resp-man/error,   archive: fnbrf01/fint-resp-man/archive }
  namespace: ${AGT_NAMESPACE:dcre}
  # SCRUM-70 flow namespaces: AGT stays in the control namespace (agt.namespace);
  # stage Jobs launch into the flow namespace of the route family.
  namespace-col: ${AGT_NAMESPACE_COL:dcre-col}
  namespace-pay: ${AGT_NAMESPACE_PAY:dcre-pay}
  namespace-man: ${AGT_NAMESPACE_MAN:dcre-man}
  # INTERIM (R-42): comma-separated client tokens on the pay flow, until the
  # R-14 client reference table lands.
  pay-clients: ${AGT_PAY_CLIENTS:FNBRF01}
  holder-id: ${HOSTNAME:local-agt}
  launch-enabled: ${AGT_LAUNCH_ENABLED:true}
  # The 29 stage images: 28 stage services across three families plus the
  # cross-family HCS, exactly the roster of infra/dcre-infra/scripts/switch-version.sh,
  # which sets AGT_<STAGE>_IMAGE=dcre-<stage>:<version> for each. A knob AGT does not
  # recognise makes that export silently inert, so the two lists are one contract.
  # Empty default = launch-disabled (SCRUM-33: no stub fallback), which is what every
  # one of them holds now: the v1 cutover retired the pre-cutover image names
  # (dcre-ixr, dcre-sxr, dcre-pxr, dcre-ais, and the COLLECTIONS dcre-prg), so a
  # non-empty default here would name an image that is no longer built and wedge the
  # stage on ImagePullBackOff. Clean-clone rule: a fresh clone boots with no .env.
  #
  # collections
  crr-image: ${AGT_CRR_IMAGE:}
  ctv-image: ${AGT_CTV_IMAGE:}
  cde-image: ${AGT_CDE_IMAGE:}
  crw-image: ${AGT_CRW_IMAGE:}
  cir-image: ${AGT_CIR_IMAGE:}
  cix-image: ${AGT_CIX_IMAGE:}
  csx-image: ${AGT_CSX_IMAGE:}
  cpx-image: ${AGT_CPX_IMAGE:}
  # CRG is the COLLECTIONS report generator. Before 2026-08-08 this job ran under
  # the name PRG; the token below now names the PAYMENTS one.
  crg-image: ${AGT_CRG_IMAGE:}
  # payments
  prr-image: ${AGT_PRR_IMAGE:}
  ptv-image: ${AGT_PTV_IMAGE:}
  pai-image: ${AGT_PAI_IMAGE:}
  prw-image: ${AGT_PRW_IMAGE:}
  pir-image: ${AGT_PIR_IMAGE:}
  pix-image: ${AGT_PIX_IMAGE:}
  psx-image: ${AGT_PSX_IMAGE:}
  ppx-image: ${AGT_PPX_IMAGE:}
  # PRG is the PAYMENTS report generator. This knob CHANGED MEANING at the cutover.
  prg-image: ${AGT_PRG_IMAGE:}
  # mandates
  mrr-image: ${AGT_MRR_IMAGE:}
  mrv-image: ${AGT_MRV_IMAGE:}
  mas-image: ${AGT_MAS_IMAGE:}
  mit-image: ${AGT_MIT_IMAGE:}
  mir-image: ${AGT_MIR_IMAGE:}
  mrw-image: ${AGT_MRW_IMAGE:}
  mix-image: ${AGT_MIX_IMAGE:}
  msx-image: ${AGT_MSX_IMAGE:}
  mpx-image: ${AGT_MPX_IMAGE:}
  mrg-image: ${AGT_MRG_IMAGE:}
  # cross-family
  hcs-image: ${AGT_HCS_IMAGE:}
  # INTERIM (R-42 analog for M10): comma-separated mandate-capable client
  # tokens, until the R-14 client reference table lands.
  man-clients: ${AGT_MAN_CLIENTS:FNBCC01,FNBCC02,FNBRF01}
  crw-interval-seconds: ${AGT_CRW_INTERVAL_SECONDS:60}
  # Separate knobs on purpose: collections transaction lists are processed ON the
  # collection day and payments transactions IMMEDIATELY, so the two report cadences
  # have no reason to move together.
  crg-interval-seconds: ${AGT_CRG_INTERVAL_SECONDS:60}
  prg-interval-seconds: ${AGT_PRG_INTERVAL_SECONDS:60}
  hcs-interval-hours: ${AGT_HCS_INTERVAL_HOURS:6}
  mrg-interval-seconds: ${AGT_MRG_INTERVAL_SECONDS:60}
  # SCRUM-91: expiry is a view predicate now (no sweep). Suspension moved into MRG.
  mrg-suspend-interval-seconds: ${AGT_MRG_SUSPEND_INTERVAL_SECONDS:60}
  # SCRUM-70: FQDN, not the short service name. This URL is handed to stage
  # pods in the FLOW namespaces (dcre-col/pay/man); `crdb` only resolves inside
  # the control namespace where the Service lives.
  service-db-url: ${AGT_SERVICE_DB_URL:jdbc:postgresql://crdb.dcre.svc.cluster.local:26257/dcre_col?sslmode=disable}
  # v1 topology: PAYMENTS stage Jobs persist in dcre_pay. Without this knob every
  # payments stage received the collections URL and would have built the payments
  # schema inside dcre_col without erroring, because the write is perfectly valid
  # against the wrong database. StageDatabases resolves it with no default arm.
  pay-service-db-url: ${AGT_PAY_SERVICE_DB_URL:jdbc:postgresql://crdb.dcre.svc.cluster.local:26257/dcre_pay?sslmode=disable}
  # B2 (SCRUM-79 review): M10 mandates stage Jobs persist in dcre_man; the DB
  # URL follows the stage's flow family (JobLauncher), never a shared default.
  man-service-db-url: ${AGT_MAN_SERVICE_DB_URL:jdbc:postgresql://crdb.dcre.svc.cluster.local:26257/dcre_man?sslmode=disable}
  # Owner ruling 2026-08-08: holiday data in dcre_col is a 12FactorApp violation
  # (https://12factor.net/), so the calendar has its own context and database. HCS
  # used to receive service-db-url because the enum naming a stage's NAMESPACE was
  # also the enum naming its DATABASE, and HCS runs in dcre-col. shared/hcs now
  # refuses to start unless current_database() is dcre_hcs, so without this knob
  # every HCS pod dies on startup.
  hcs-service-db-url: ${AGT_HCS_SERVICE_DB_URL:jdbc:postgresql://crdb.dcre.svc.cluster.local:26257/dcre_hcs?sslmode=disable}
  # The account registry, the second cross-family reference context. No Stage maps
  # here yet (shared/acs is being built); the routing exists ahead of the stage so
  # that adding the constant FAILS the StageDatabases/StageNamespaces switches until
  # somebody names its database and namespace, rather than defaulting to collections.
  acs-service-db-url: ${AGT_ACS_SERVICE_DB_URL:jdbc:postgresql://crdb.dcre.svc.cluster.local:26257/dcre_acs?sslmode=disable}
  # SCRUM-107: the mandate store CTV's DC-flow gate reads, handed to every CTV
  # stage pod as DCRE_CTV_MANDATE_SOURCE. Default `projection` mirrors ctv's own
  # application.yml default: dcre_man man_ctv_view is the authority, and the
  # dcre_col.mandate table the former `legacy` value read has been dropped.
  ctv-mandate-source: ${AGT_CTV_MANDATE_SOURCE:projection}
  # M12/SCRUM-88 (R-47): the agt_ops URL handed to every launched stage pod so
  # the platform-batch heartbeat writer (T2) can reach agt_ops. FQDN for the
  # same reason as man-service-db-url; identical for all flows. user = root
  # (dev cluster); the password holds the blank datasource default.
  agtops-db-url: ${AGT_AGTOPS_DB_URL:jdbc:postgresql://crdb.dcre.svc.cluster.local:26257/agt_ops?sslmode=disable}
  agtops-db-user: ${AGT_AGTOPS_DB_USER:root}
  stage-memory-request: ${AGT_STAGE_MEMORY_REQUEST:512Mi}
  stage-memory-limit: ${AGT_STAGE_MEMORY_LIMIT:768Mi}
  stage-deadline-seconds: ${AGT_STAGE_DEADLINE_SECONDS:900}
  orphan-max-attempts: ${AGT_ORPHAN_MAX_ATTEMPTS:3}
  # Ceiling for TECH_CONFIG_FAILED (stage pod exit 78 = platform-batch pre-runner
  # startup failure: config import / binding / secret fetch). Infrastructure, not
  # a job outcome, so the work is still retried but on its own budget: the first
  # relaunch is immediate and later ones are spaced by orphan-backoff-seconds, so
  # 10 covers ~9 minutes, roughly 3x a cfg rolling restart or a Vault re-seed.
  # Bounded on purpose: exhaustion still mints TECH_EXHAUSTED and fails the DAG.
  infra-max-attempts: ${AGT_INFRA_MAX_ATTEMPTS:10}
  orphan-backoff-seconds: ${AGT_ORPHAN_BACKOFF_SECONDS:60}
  # M12/SCRUM-86 (R-47): wedged-but-alive detection. A LAUNCHED intent whose
  # heartbeat_at fell behind this TTL is relaunched (heartbeat writes every 10s
  # from the stage pod, so 45s ~= 4 missed beats).
  heartbeat-ttl-seconds: ${AGT_HEARTBEAT_TTL_SECONDS:45}
  # M12/SCRUM-87 (R-47): AGT self-liveness. The reconciler liveness probe goes
  # DOWN if no tick within this TTL (3x the 5s reconcile interval); k8s restarts.
  self-liveness-ttl-seconds: ${AGT_SELF_LIVENESS_TTL_SECONDS:15}
  # SCRUM-55 Task 13: Fintegrate SLA thresholds in hours (amber warn, red breach).
  sla-amber-hours: ${AGT_SLA_AMBER_HOURS:20}
  sla-red-hours: ${AGT_SLA_RED_HOURS:24}
  # Bounded-attempt guard on the IMMEDIATE report trigger: consecutive scans that may
  # see the same (flow, client, parent) still due before AGT WARNs. It makes a silent
  # loop visible; it never retries, widens or falls back. At the default 15s scan
  # cadence, 20 scans is ~5 minutes.
  report-stall-scans: ${AGT_REPORT_STALL_SCANS:20}

# SCRUM-55 report knobs live under dcre.agt (outside the strict agt
# ConfigMapping prefix; consumed directly by scheduler expressions).
dcre:
  agt:
    # prg_report_due scan cadence in seconds (number-only Quarkus duration).
    report-scan-seconds: ${AGT_REPORT_SCAN_SECONDS:15}
    # prg_sla_pending scan cadence in seconds (number-only Quarkus duration).
    sla-scan-seconds: ${AGT_SLA_SCAN_SECONDS:300}

"%test":
  quarkus:
    scheduler:
      enabled: false
    http:
      # Random port: 8081 collides with kubectl port-forwards on shared dev hosts.
      test-port: 0
  agt:
    launch-enabled: false
    exchange-root: build/test-exchange
