# 12FactorApp: every value below is a committed working dev default; env overrides.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${AGT_DB_URL:jdbc:postgresql://localhost:26257/agt_ops?sslmode=disable}
quarkus.datasource.username=${AGT_DB_USER:root}
quarkus.datasource.password=${AGT_DB_PASSWORD:}

quarkus.liquibase.migrate-at-start=true
quarkus.liquibase.change-log=db/changelog/db.changelog-master.xml

agt.exchange-root=${DCRE_EXCHANGE_ROOT:../../../infra/dcre-infra/exchange}
agt.namespace=${AGT_NAMESPACE:dcre}
agt.holder-id=${HOSTNAME:local-agt}
agt.stub-image=${AGT_STUB_IMAGE:busybox:1.37.0}
agt.launch-enabled=${AGT_LAUNCH_ENABLED:true}

quarkus.kubernetes-client.namespace=${AGT_NAMESPACE:dcre}
quarkus.kubernetes-client.devservices.enabled=false

quarkus.otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] %s%e%n

%test.quarkus.scheduler.enabled=false
%test.agt.launch-enabled=false

%test.agt.exchange-root=build/test-exchange
