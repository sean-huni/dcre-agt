plugins {
    id 'java'
    id 'io.quarkus'
}

repositories {
    mavenCentral()
    mavenLocal()
}

dependencies {
    implementation enforcedPlatform("${quarkusPlatformGroupId}:${quarkusPlatformArtifactId}:${quarkusPlatformVersion}")
    implementation 'io.quarkus:quarkus-scheduler'
    implementation 'io.quarkus:quarkus-micrometer-opentelemetry'
    implementation 'io.quarkus:quarkus-rest-jackson'
    implementation 'io.quarkus:quarkus-smallrye-health'
    implementation 'io.quarkus:quarkus-kubernetes-client'
    implementation 'io.quarkus:quarkus-jdbc-postgresql'
    implementation 'io.quarkus:quarkus-liquibase'
    implementation 'io.quarkus:quarkus-arc'
    implementation 'io.quarkus:quarkus-config-yaml'
    implementation 'io.quarkus:quarkus-rest'
    testImplementation 'io.quarkus:quarkus-junit'
    testImplementation 'io.quarkus:quarkus-junit-mockito'
    // SCRUM-70: fabric8 CRUD mock API server for cross-namespace launch/observe tests.
    testImplementation 'io.quarkus:quarkus-test-kubernetes-client'
    testImplementation 'io.rest-assured:rest-assured'
    testImplementation 'org.testcontainers:cockroachdb:1.21.4'
    testImplementation 'org.testcontainers:junit-jupiter:1.21.4'
}

group = 'za.co.fnb.dcre'
version = '2.0.1'

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

compileJava {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-parameters'
}

compileTestJava {
    options.encoding = 'UTF-8'
}

test {
    // Gradle defaults a test worker to 512m, which this suite cannot complete in:
    // ~19 @QuarkusTest classes across 11 TestProfiles each boot a Quarkus context
    // plus a CockroachDB Testcontainer, and the worker dies with
    // "Test process encountered an unexpected problem" whose real cause is
    // OutOfMemoryError: Java heap space. Reproduced on a clean dev checkout, so it
    // predates any one change: without this the suite cannot be run at all.
    maxHeapSize = '4g'
}
